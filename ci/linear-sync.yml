name: Linear Sync & CI Pipeline

on:
  push:
    branches:
      - main
      - 'brandonbinion02/*'
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  validate-linear-issue:
    name: Validate Linear Issue Reference
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Branch or PR Mentions Linear Issue
        run: |
          REF_NAME="${{ github.head_ref || github.ref_name }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_BODY="${{ github.event.pull_request.body }}"
          
          echo "Inspecting ref: $REF_NAME"
          if [[ "$REF_NAME" =~ [bB][rR][aA]-[0-9]+ ]] || [[ "$PR_TITLE" =~ [bB][rR][aA]-[0-9]+ ]] || [[ "$PR_BODY" =~ [bB][rR][aA]-[0-9]+ ]]; then
            echo "✅ Linear Issue Key detected (e.g. BRA-2)"
          else
            echo "ℹ️ Note: Link pull request to a Linear issue using 'Fixes BRA-X' or a branch name like 'brandonbinion02/bra-X-title'."
          fi

  test-and-build:
    name: Run Test Suite & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build TypeScript
        run: pnpm run build

      - name: Run E2E Test Suite
        run: pnpm test
